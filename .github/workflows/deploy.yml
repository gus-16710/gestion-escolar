name: deploy

# Each push to master runs the tests and, if they pass, builds the app and copies it to
# ciccis.unaideamas.com over SSH (cPanel). It can also be launched by hand from GitHub → Actions.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# A newer push replaces a deploy that hasn't started yet, so two never copy files at once.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  # The folder of the subdomain; cPanel serves its public/ subfolder.
  DESTINO: /home4/unaideam/ciccis.unaideamas.com/

jobs:
  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # Feature tests render Inertia pages, which need the Vite manifest.
      - name: Build assets
        run: npm run build

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: ./vendor/bin/pest

  deploy:
    name: Desplegar
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same PHP as the server (8.3) so vendor/ is compatible.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Composer scripts (package:discover) need an .env; it is never copied to the server.
      - name: Install PHP dependencies (production)
        run: |
          cp .env.example .env
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # The host's firewall sometimes resets SSH connections coming from GitHub's runners, so every
      # connection is retried with growing pauses instead of failing at the first reset.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/reintentar.sh <<'SCRIPT'
          # Runs the given command up to 6 times, waiting 15, 30, 45... seconds between attempts.
          for intento in 1 2 3 4 5 6; do
            "$@" && exit 0
            echo "::warning::Intento $intento falló (el servidor cortó la conexión); se reintenta en $((intento * 15)) s."
            sleep $((intento * 15))
          done
          echo "::error::No se pudo conectar al servidor después de 6 intentos."
          exit 1
          SCRIPT
          chmod +x ~/reintentar.sh

      - name: Sync files (rsync over SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        # Kept on the server, never overwritten or deleted:
        # - .env and what the app writes (storage/framework, logs, uploaded photos in storage/app/public);
        # - public/storage is a symlink, so no trailing "/" (with one, rsync --delete removes it);
        # - public/.well-known is used by cPanel's SSL; public/hot would make pages look for Vite.
        run: |
          ~/reintentar.sh rsync -az --delete --stats \
            -e "ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15" \
            --exclude=.git/ --exclude=.github/ --exclude=node_modules/ --exclude=tests/ --exclude=.env \
            --exclude=public/hot --exclude=public/storage --exclude=public/.well-known/ \
            --exclude=storage/app/public/ --exclude=storage/framework/ --exclude=storage/logs/ \
            ./ "$SSH_USER@$SSH_HOST:$DESTINO"

      - name: Run Artisan on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          cat > remoto.sh <<SCRIPT
          set -e
          cd $DESTINO
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache
          if [ ! -f .env ]; then
            echo "Falta .env en el servidor: el código ya está copiado; configúralo para terminar la instalación."
            exit 0
          fi
          php artisan migrate --force
          [ -L public/storage ] || php artisan storage:link
          php artisan optimize:clear
          php artisan optimize
          echo "Despliegue terminado."
          SCRIPT
          ~/reintentar.sh sh -c "ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 $SSH_USER@$SSH_HOST 'bash -s' < remoto.sh"
